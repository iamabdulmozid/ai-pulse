{% extends "base.html" %}
{% block title %}Sign in · Karbar Pulse{% endblock %}
{% block anon %}
<div style="min-height:100vh; display:grid; place-items:center; background:var(--bg);">
  <div class="card" style="width:340px; padding:26px;">
    <div style="display:flex; align-items:center; gap:8px; font-weight:600;">
      <span style="width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;">K</span>
      Karbar Pulse
    </div>
    <h1 style="font-size:18px; margin:18px 0 4px;">Sign in</h1>
    <p style="color:var(--muted); font-size:13px; margin:0 0 16px;">Karbar Sourcing Bangladesh</p>
    {% if form.errors %}<p style="color:var(--crit); font-size:13px;">Invalid username or password.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label style="font-size:12px; color:var(--text2);">Username</label>
      <input name="username" autofocus style="width:100%; padding:8px; margin:4px 0 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text);">
      <label style="font-size:12px; color:var(--text2);">Password</label>
      <input name="password" type="password" style="width:100%; padding:8px; margin:4px 0 16px; border:1px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text);">
      <button type="submit" style="width:100%; padding:9px; border:0; border-radius:8px; background:var(--accent); color:var(--on-accent); font-weight:600; cursor:pointer;">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
