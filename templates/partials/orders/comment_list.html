{% load pulse %}
<div id="po-comments-inner">
  {% if can_comment %}
  <form hx-post="{% url 'orders:po_comment_create' po_no %}" hx-target="#po-comments" hx-swap="innerHTML"
        style="display:flex; gap:8px; margin-bottom:12px;">
    <input class="input" type="text" name="text" placeholder="Add a comment…" style="flex:1;" required>
    <button class="btn btn-accent" type="submit">Comment</button>
  </form>
  {% else %}
  <div style="font-size:12px; color:var(--faint); margin-bottom:10px;">
    You can read all comments; only the PO's merchandiser, Management or Admin can post.
  </div>
  {% endif %}
  {% for c in comments %}
    <div class="driver">
      <b>{{ c.author }}</b>
      <span style="color:var(--faint); font-size:11px;">· {{ c.role }} · {{ c.at|date:"d M Y, H:i" }}</span>
      <div style="color:var(--text); margin-top:2px;">{{ c.text }}</div>
    </div>
  {% empty %}
    <div style="color:var(--muted); font-size:13px;">No comments yet.</div>
  {% endfor %}
</div>
